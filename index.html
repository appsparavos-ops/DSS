<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <!-- Icono -->
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="apple-touch-icon" href="./pwa-192x192.png" />

    <!-- Color de la barra de estado / app -->
    <meta name="theme-color" content="#1a237e" />

    <!-- Android -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- iOS Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DSS" />

    <meta name="description" content="Planilla de Juego Digital Oficial para Baloncesto" />
    <meta name="application-name" content="DSS" />

    <!--
      NOTA: El tag <link rel="manifest"> lo inyecta vite-plugin-pwa en la build.
      No lo ponemos a mano para evitar duplicados (dos <link rel="manifest">
      con crossorigin distintos impiden la instalación en Chrome Android).
    -->

    <title>FIBA Digital Score Sheet</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Esta aplicación requiere JavaScript para funcionar.</noscript>
    <script type="module" src="/src/main.tsx"></script>
